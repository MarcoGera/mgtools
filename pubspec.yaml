name: mgtools
description: "MGtools — кроссплатформенный органайзер (Закладки, Заметки, Напоминания, Папки, Изображения) для Samsung Galaxy S25 Plus и Windows ПК с синхронизацией через JSON-файлы."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  path_provider: ^2.1.4
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
